    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@400;700&amp;display=swap');
        
        body {

        .app-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translate(-50%, 0);
            will-change: transform;
            background: linear-gradient(135deg, rgba(255, 240, 245, 0.92), rgba(224, 247, 250, 0.92));
            color: #3f3f46;
            border: 1px solid rgba(248, 187, 217, 0.7);
            padding: 10px 24px;
            border-radius: 9999px;
            font-size: 14px;
            box-shadow: 0 8px 20px -4px rgba(244, 143, 177, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            white-space: nowrap;
            transition: opacity 0.25s ease;
        }

        .app-toast strong {
            color: #F48FB1;
            font-weight: 600;
        }

        /* ---- 装饰性增强：延续粉蓝主色调 ---- */

        /* 选中文字时的高亮配色 */
        ::selection {
            background-color: #F8BBD9;
            color: #18181b;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #FFF0F5;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #F48FB1, #80DEEA);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #EC6FA0, #4DD0E1);
        }
        html {
            scrollbar-color: #F48FB1 #FFF0F5;
        }

        /* 社交卡片悬停时左侧出现渐变色光条 */
        .social-link {
            position: relative;
            overflow: hidden;
        }
        .social-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, #F48FB1, #4DD0E1);
            transform: scaleY(0);
            transition: transform 0.25s ease;
        }
        .social-link:hover::before {
            transform: scaleY(1);
        }
        .social-link:hover {
            box-shadow: 0 8px 20px -8px rgba(244, 143, 177, 0.35);
        }

        /* 生日/邮箱等链接的下划线扫光效果 */
        .info-row a {
            position: relative;
            text-decoration: none;
        }

        /* 头像外圈渐变光晕 */
        header img {
            transition: box-shadow 0.25s ease;
        }
        header img:hover {
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px #F48FB1;
        }

        /* 基本信息卡片的柔和顶部高光 */
        .mb-16 > .bg-white {
            position: relative;
        }
        .mb-16 > .bg-white::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(244, 143, 177, 0.06), rgba(77, 208, 225, 0.06));
            pointer-events: none;
        }

        /* 页面整体淡入 */
        body {
            animation: fadeInUp 0.5s ease both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 键盘提示 kbd 的配色融入主题 */

            color: #00838F;

        /* ---- 自定义鼠标光标：甘城猫猫 ---- */

        }
        a, button, .social-link, [onclick] {
            cursor: url('cursor-cat-link.png') 4 0, pointer;
        }
    </style>

    <script>
        // 通用提示框：浮在屏幕上，滚动页面时先随内容被带动，再带缓动地回到原位
        function showToast(html) {
            const toast = document.createElement('div');
            toast.className = 'app-toast';
            toast.innerHTML = html;
            // 挂到 <html> 上：body 带有入场动画的 transform，会让 fixed 失效
            document.documentElement.appendChild(toast);

            let offset = 0;
            let lastY = window.scrollY;
            let alive = true;
            const onScroll = () => {
                const y = window.scrollY;
                offset += lastY - y;                         // 跟随页面滚动的方向
                offset = Math.max(-160, Math.min(160, offset));
                lastY = y;
            };
            window.addEventListener('scroll', onScroll, { passive: true });

            const tick = () => {
                if (!alive) return;
                offset *= 0.78;                              // 缓动回位
                if (Math.abs(offset) < 0.1) offset = 0;
                toast.style.transform = `translate(-50%, ${offset}px)`;
                requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => {
                    alive = false;
                    window.removeEventListener('scroll', onScroll);
                    toast.remove();
                }, 250);
            }, 2300);
        }

        function copyDiscord(e) {
            e.preventDefault();
            const discordName = 'Aelrainyx';
            const ok = () => showToast(`已复制 Discord 名字：<strong>${discordName}</strong>`);
            const fail = () => prompt('请手动复制 Discord 名字：', discordName);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(discordName).then(ok).catch(fail);
            } else {
                fail();
            }
        }

        // 邮箱地址拆分存储，避免被简单爬虫直接抓取明文地址
        // 首次点击时才拼接出真实地址并触发 mailto
        (function () {
            const parts = ['Aelrainyx', 'Gmail.com'];
            const emailLink = document.getElementById('email-link');
            const emailText = document.getElementById('email-text');
            if (!emailLink || !emailText) return;

            let revealed = false;
            emailLink.addEventListener('click', function (e) {
                if (!revealed) {
                    e.preventDefault();
                    const address = parts.join('@');
                    emailText.textContent = address;
                    emailLink.href = 'mailto:' + address;
                    revealed = true;
                }
            });
        })();

        window.onload = function() {
            document.addEventListener('keydown', function(e) {
                if (e.key === '/' && document.activeElement.tagName === 'BODY') {
                    e.preventDefault();
                    const social = document.getElementById('social');
                    if (social) social.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }
    </script>
